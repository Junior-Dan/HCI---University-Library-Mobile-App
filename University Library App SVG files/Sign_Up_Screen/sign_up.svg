<svg xmlns="http://www.w3.org/2000/svg" width="400" height="820" viewBox="0 0 400 820">
  <!-- Background -->
  <rect width="400" height="820" fill="#f0f1f3"/>

  <!-- Phone frame -->
  <rect x="20" y="20" width="360" height="780" rx="36" ry="36" fill="#1a1a1a"/>
  <rect x="30" y="30" width="340" height="760" rx="28" ry="28" fill="#ffffff"/>

  <!-- Header -->
  <text x="55" y="72" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#111">‹</text>
  <text x="85" y="72" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#111">Sign Up</text>
  <line x1="30" y1="90" x2="370" y2="90" stroke="#dddddd" stroke-width="1"/>

  <!-- Input fields -->
  <!-- Full Name -->
  <rect x="50" y="120" width="300" height="44" rx="6" ry="6" fill="#fff" stroke="#999" stroke-width="1"/>
  <text x="65" y="147" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#999">Full Name</text>

  <!-- Email -->
  <rect x="50" y="180" width="300" height="44" rx="6" ry="6" fill="#fff" stroke="#999" stroke-width="1"/>
  <text x="65" y="207" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#999">Email</text>

  <!-- Password -->
  <rect x="50" y="240" width="300" height="44" rx="6" ry="6" fill="#fff" stroke="#999" stroke-width="1"/>
  <text x="65" y="267" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#999">Password</text>

  <!-- Confirm Password -->
  <rect x="50" y="300" width="300" height="44" rx="6" ry="6" fill="#fff" stroke="#999" stroke-width="1"/>
  <text x="65" y="327" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#999">Confirm Password</text>

  <!-- Create Account button -->
  <rect x="50" y="370" width="300" height="48" rx="6" ry="6" fill="#2563EB"/>
  <text x="200" y="400" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Create Account</text>

  <!-- Already have an account button -->
  <rect x="50" y="435" width="300" height="48" rx="6" ry="6" fill="#eeeeee" stroke="#999" stroke-width="1"/>
  <text x="200" y="465" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">Already have an account? Log In</text>
</svg>