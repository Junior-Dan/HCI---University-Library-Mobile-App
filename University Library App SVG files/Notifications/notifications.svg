<svg viewBox="0 0 360 780" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="360" height="780" fill="#ffffff" stroke="#cccccc"/>

  <path d="M20 30 l-8 8 l8 8" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="40" y="35" font-size="18" font-weight="bold" fill="#111111">Notifications</text>
  <line x1="0" y1="50" x2="360" y2="50" stroke="#dddddd" stroke-width="1"/>

  <!-- item 1 (unread) -->
  <rect x="20" y="65" width="320" height="66" fill="#f5f8ff" stroke="#dddddd" stroke-width="1"/>
  <circle cx="34" cy="82" r="4" fill="#2563EB"/>
  <text x="48" y="86" font-size="13" font-weight="bold" fill="#111111">Reservation ready for pickup</text>
  <text x="48" y="104" font-size="12" fill="#666666">"The Great Gatsby" is waiting at the desk.</text>
  <text x="48" y="120" font-size="11" fill="#999999">2 hours ago</text>

  <!-- item 2 (unread) -->
  <rect x="20" y="139" width="320" height="66" fill="#f5f8ff" stroke="#dddddd" stroke-width="1"/>
  <circle cx="34" cy="156" r="4" fill="#2563EB"/>
  <text x="48" y="160" font-size="13" font-weight="bold" fill="#111111">Book due tomorrow</text>
  <text x="48" y="178" font-size="12" fill="#666666">"1984" is due back on 2024-01-15.</text>
  <text x="48" y="194" font-size="11" fill="#999999">1 day ago</text>

  <!-- item 3 (read) -->
  <rect x="20" y="213" width="320" height="66" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
  <text x="48" y="234" font-size="13" font-weight="bold" fill="#444444">New arrivals this week</text>
  <text x="48" y="252" font-size="12" fill="#666666">12 new titles just added to the catalogue.</text>
  <text x="48" y="268" font-size="11" fill="#999999">3 days ago</text>

  <!-- item 4 (read) -->
  <rect x="20" y="287" width="320" height="66" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
  <text x="48" y="308" font-size="13" font-weight="bold" fill="#444444">Reservation confirmed</text>
  <text x="48" y="326" font-size="12" fill="#666666">Your reservation for "To Kill a Mockingbird".</text>
  <text x="48" y="342" font-size="11" fill="#999999">5 days ago</text>

  <!-- Bottom nav -->
  <line x1="0" y1="730" x2="360" y2="730" stroke="#dddddd" stroke-width="1"/>
  <path d="M100 742 L110 734 L120 742 V756 H100 Z" fill="none" stroke="#2563EB" stroke-width="1.5"/>
  <text x="110" y="770" text-anchor="middle" font-size="10" fill="#2563EB" font-weight="bold">Home</text>
  <circle cx="180" cy="746" r="7" fill="none" stroke="#666666" stroke-width="1.3"/>
  <line x1="185" y1="751" x2="190" y2="756" stroke="#666666" stroke-width="1.3"/>
  <text x="180" y="770" text-anchor="middle" font-size="10" fill="#666666">Search</text>
  <circle cx="255" cy="742" r="5" fill="none" stroke="#666666" stroke-width="1.3"/>
  <path d="M245 758 Q255 746 265 758" fill="none" stroke="#666666" stroke-width="1.3"/>
  <text x="255" y="770" text-anchor="middle" font-size="10" fill="#666666">Profile</text>
</svg>
