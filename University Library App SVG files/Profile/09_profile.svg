<svg viewBox="0 0 360 780" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="360" height="780" fill="#ffffff" stroke="#cccccc"/>

  <text x="20" y="35" font-size="18" font-weight="bold" fill="#111111">Profile</text>
  <circle cx="333" cy="27" r="8" fill="none" stroke="#333333" stroke-width="1.2"/>
  <line x1="333" y1="20" x2="333" y2="34" stroke="#333333" stroke-width="1.2"/>
  <line x1="326" y1="27" x2="340" y2="27" stroke="#333333" stroke-width="1.2"/>
  <line x1="0" y1="50" x2="360" y2="50" stroke="#dddddd" stroke-width="1"/>

  <!-- avatar -->
  <rect x="150" y="70" width="60" height="60" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <line x1="150" y1="70" x2="210" y2="130" stroke="#333333" stroke-width="1"/>
  <line x1="210" y1="70" x2="150" y2="130" stroke="#333333" stroke-width="1"/>

  <text x="180" y="155" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">John Doe</text>
  <text x="180" y="173" text-anchor="middle" font-size="12" fill="#666666">john.doe@example.com</text>

  <text x="20" y="205" font-size="14" font-weight="bold" fill="#111111">Borrowed Books</text>

  <!-- book 1 -->
  <rect x="20" y="218" width="50" height="60" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <line x1="20" y1="218" x2="70" y2="278" stroke="#333333" stroke-width="0.8"/>
  <line x1="70" y1="218" x2="20" y2="278" stroke="#333333" stroke-width="0.8"/>
  <text x="82" y="235" font-size="13" font-weight="bold" fill="#111111">The Great Gatsby</text>
  <text x="82" y="251" font-size="12" fill="#666666">F. Scott Fitzgerald</text>
  <text x="82" y="267" font-size="12" fill="#555555">Due: <tspan fill="#2563EB">2023-12-31</tspan></text>

  <!-- book 2 -->
  <rect x="20" y="288" width="50" height="60" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <line x1="20" y1="288" x2="70" y2="348" stroke="#333333" stroke-width="0.8"/>
  <line x1="70" y1="288" x2="20" y2="348" stroke="#333333" stroke-width="0.8"/>
  <text x="82" y="305" font-size="13" font-weight="bold" fill="#111111">1984</text>
  <text x="82" y="321" font-size="12" fill="#666666">George Orwell</text>
  <text x="82" y="337" font-size="12" fill="#555555">Due: <tspan fill="#2563EB">2024-01-15</tspan></text>

  <text x="20" y="378" font-size="14" font-weight="bold" fill="#111111">Reservations</text>
  <rect x="20" y="390" width="50" height="60" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <line x1="20" y1="390" x2="70" y2="450" stroke="#333333" stroke-width="0.8"/>
  <line x1="70" y1="390" x2="20" y2="450" stroke="#333333" stroke-width="0.8"/>

  <!-- Bottom nav -->
  <line x1="0" y1="730" x2="360" y2="730" stroke="#dddddd" stroke-width="1"/>
  <path d="M100 742 L110 734 L120 742 V756 H100 Z" fill="none" stroke="#666666" stroke-width="1.5"/>
  <text x="110" y="770" text-anchor="middle" font-size="10" fill="#666666">Home</text>
  <circle cx="180" cy="746" r="7" fill="none" stroke="#666666" stroke-width="1.3"/>
  <line x1="185" y1="751" x2="190" y2="756" stroke="#666666" stroke-width="1.3"/>
  <text x="180" y="770" text-anchor="middle" font-size="10" fill="#666666">Search</text>
  <circle cx="255" cy="742" r="5" fill="none" stroke="#2563EB" stroke-width="1.5"/>
  <path d="M245 758 Q255 746 265 758" fill="none" stroke="#2563EB" stroke-width="1.5"/>
  <text x="255" y="770" text-anchor="middle" font-size="10" fill="#2563EB" font-weight="bold">Profile</text>
</svg>
