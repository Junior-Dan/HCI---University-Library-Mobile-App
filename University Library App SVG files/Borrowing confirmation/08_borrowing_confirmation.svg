<svg viewBox="0 0 360 780" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="360" height="780" fill="#ffffff" stroke="#cccccc"/>

  <text x="20" y="35" font-size="18" font-weight="bold" fill="#111111">Borrowing Confirmation</text>
  <line x1="0" y1="50" x2="360" y2="50" stroke="#dddddd" stroke-width="1"/>

  <!-- success check -->
  <circle cx="180" cy="120" r="30" fill="#16A34A"/>
  <path d="M165 120 L176 132 L198 106" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="180" y="180" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Book Borrowed</text>
  <text x="180" y="202" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Successfully!</text>

  <text x="180" y="228" text-anchor="middle" font-size="12" fill="#555555">You have successfully borrowed "The Great</text>
  <text x="180" y="244" text-anchor="middle" font-size="12" fill="#555555">Gatsby". Please return it by October 26,</text>
  <text x="180" y="260" text-anchor="middle" font-size="12" fill="#555555">2023.</text>

  <!-- book card -->
  <rect x="30" y="285" width="300" height="72" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
  <rect x="42" y="296" width="45" height="50" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <line x1="42" y1="296" x2="87" y2="346" stroke="#333333" stroke-width="0.8"/>
  <line x1="87" y1="296" x2="42" y2="346" stroke="#333333" stroke-width="0.8"/>
  <text x="98" y="315" font-size="13" font-weight="bold" fill="#111111">The Great Gatsby</text>
  <text x="98" y="333" font-size="12" fill="#666666">F. Scott Fitzgerald</text>

  <!-- View Borrowed Books -->
  <rect x="30" y="375" width="300" height="42" rx="4" fill="#2563EB"/>
  <text x="180" y="401" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="bold">View Borrowed Books</text>

  <!-- Back to Home -->
  <rect x="30" y="425" width="300" height="42" rx="4" fill="#eeeeee" stroke="#999999" stroke-width="1"/>
  <text x="180" y="451" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold">Back to Home</text>

  <!-- Bottom nav -->
  <line x1="0" y1="730" x2="360" y2="730" stroke="#dddddd" stroke-width="1"/>
  <path d="M100 742 L110 734 L120 742 V756 H100 Z" fill="none" stroke="#666666" stroke-width="1.5"/>
  <text x="110" y="770" text-anchor="middle" font-size="10" fill="#666666">Home</text>
  <circle cx="180" cy="746" r="7" fill="none" stroke="#666666" stroke-width="1.3"/>
  <line x1="185" y1="751" x2="190" y2="756" stroke="#666666" stroke-width="1.3"/>
  <text x="180" y="770" text-anchor="middle" font-size="10" fill="#666666">Search</text>
  <circle cx="255" cy="742" r="5" fill="none" stroke="#666666" stroke-width="1.3"/>
  <path d="M245 758 Q255 746 265 758" fill="none" stroke="#666666" stroke-width="1.3"/>
  <text x="255" y="770" text-anchor="middle" font-size="10" fill="#666666">Profile</text>
</svg>
