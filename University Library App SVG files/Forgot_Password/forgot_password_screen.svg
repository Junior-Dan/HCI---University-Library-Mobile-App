<svg xmlns="http://www.w3.org/2000/svg" width="390" height="780" viewBox="0 0 390 780">
  <!-- Phone bezel -->
  <rect x="8" y="8" width="374" height="764" rx="40" ry="40" fill="#1a1a1a"/>
  <!-- Screen -->
  <rect x="18" y="18" width="354" height="744" rx="32" ry="32" fill="#ffffff"/>
  
  <!-- Status bar area (subtle) -->
  <rect x="18" y="18" width="354" height="28" rx="32" ry="32" fill="#ffffff"/>
  
  <!-- Header -->
  <g transform="translate(18, 52)">
    <!-- Back chevron -->
    <path d="M22 18 L12 28 L22 38" fill="none" stroke="#111827" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Title -->
    <text x="42" y="32" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#111827">Forgot Password</text>
  </g>
  
  <!-- Divider line under header -->
  <line x1="18" y1="98" x2="372" y2="98" stroke="#f3f4f6" stroke-width="1"/>
  
  <!-- Instruction text -->
  <text x="42" y="140" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#6b7280">
    <tspan x="42" dy="0">Enter the email address associated with your account</tspan>
    <tspan x="42" dy="20">and we'll send you a link to reset your password.</tspan>
  </text>
  
  <!-- Email input -->
  <rect x="42" y="190" width="306" height="44" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="56" y="218" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#9ca3af">Email address</text>
  
  <!-- Send Reset Link button (blue) -->
  <rect x="42" y="252" width="306" height="48" rx="10" ry="10" fill="#2563eb"/>
  <text x="195" y="282" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Send Reset Link</text>
  
  <!-- Back to Log In button (gray) -->
  <rect x="42" y="316" width="306" height="48" rx="10" ry="10" fill="#f3f4f6"/>
  <text x="195" y="346" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#374151" text-anchor="middle">Back to Log In</text>
  
  <!-- Home indicator -->
  <rect x="145" y="740" width="100" height="5" rx="2.5" ry="2.5" fill="#d1d5db"/>
</svg>