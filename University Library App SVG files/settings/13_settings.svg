<svg viewBox="0 0 360 780" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="360" height="780" fill="#ffffff" stroke="#cccccc"/>

  <path d="M20 30 l-8 8 l8 8" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="40" y="35" font-size="18" font-weight="bold" fill="#111111">Settings</text>
  <line x1="0" y1="50" x2="360" y2="50" stroke="#dddddd" stroke-width="1"/>

  <!-- row 1 -->
  <text x="20" y="90" font-size="14" fill="#111111">Edit Profile</text>
  <path d="M330 82 l6 6 l-6 6" fill="none" stroke="#999999" stroke-width="1.3"/>
  <line x1="20" y1="105" x2="340" y2="105" stroke="#eeeeee" stroke-width="1"/>

  <!-- row 2 -->
  <text x="20" y="135" font-size="14" fill="#111111">Notification Preferences</text>
  <path d="M330 127 l6 6 l-6 6" fill="none" stroke="#999999" stroke-width="1.3"/>
  <line x1="20" y1="150" x2="340" y2="150" stroke="#eeeeee" stroke-width="1"/>

  <!-- row 3 -->
  <text x="20" y="180" font-size="14" fill="#111111">Change Password</text>
  <path d="M330 172 l6 6 l-6 6" fill="none" stroke="#999999" stroke-width="1.3"/>
  <line x1="20" y1="195" x2="340" y2="195" stroke="#eeeeee" stroke-width="1"/>

  <!-- row 4 -->
  <text x="20" y="225" font-size="14" fill="#111111">About / Help</text>
  <path d="M330 217 l6 6 l-6 6" fill="none" stroke="#999999" stroke-width="1.3"/>
  <line x1="20" y1="240" x2="340" y2="240" stroke="#eeeeee" stroke-width="1"/>

  <!-- log out -->
  <rect x="30" y="660" width="300" height="42" rx="4" fill="#ffffff" stroke="#cc3333" stroke-width="1"/>
  <text x="180" y="686" text-anchor="middle" font-size="14" fill="#cc3333" font-weight="bold">Log Out</text>
</svg>
